databases:
  - name: emotion-drift-db
    databaseName: emotion_drift
    user: emotion_admin
    plan: free # Use free tier

services:
  - type: web
    name: emotion-drift-api
    env: python
    region: ohio
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 4 -k uvicorn.workers.UvicornWorker api.main:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: emotion-drift-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHONPATH
        value: "."
      - key: LLM_API_KEY
        sync: false # User must set SARVAM_API_KEY in Render dashboard
      - key: LLM_MODEL
        value: "sarvam-m"
